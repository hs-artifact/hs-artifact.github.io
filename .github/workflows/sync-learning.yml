name: sync-learning-log
on:
  schedule:
    - cron: "17 23 * * *"   # 07:17 WITA daily
  workflow_dispatch:
permissions:
  contents: write
concurrency: sync-learning
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/sync.mjs
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          PROGRESS_KEY: ${{ secrets.PROGRESS_KEY }}
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "Nothing to commit"; exit 0; fi
          git config user.name "hs-artifact"
          git config user.email "hs-artifact@users.noreply.github.com"
          git add data/learning.json
          git commit -m "Learning log: daily sync"
          git push
